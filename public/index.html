<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Slide Studio</title><!--LIVE-->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eaf0f8;--pn:#ffffff;--ln:#d3dcea;--tx:#1b2a41;--mu:#5f6f88;--ac:#2f7dff;--hd:#f7f9fc;--bt:#eef2f8;--bth:#dfe8f5}
html[data-ui=blue]{--bg:#dbe9fb;--pn:#f1f7ff;--ln:#bcd2ee;--tx:#0f2747;--mu:#4d6a90;--hd:#e6f0fd;--bt:#e3eefb;--bth:#cfe1f7}
html[data-ui=warm]{--bg:#f4ede1;--pn:#fffaf1;--ln:#e2d5bf;--tx:#3a2c1a;--mu:#84705a;--ac:#c2410c;--hd:#f8f1e4;--bt:#f3e9d6;--bth:#e8d9bd}
html[data-ui=dark]{--bg:#0f1a2e;--pn:#16233d;--ln:#2a3c5e;--tx:#e6edf8;--mu:#9db4d9;--hd:#0c1629;--bt:#1f3357;--bth:#2a4373}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:168px 1fr 244px;grid-template-rows:auto auto 1fr 28px;height:100%;padding-top:env(safe-area-inset-top,0)}
#hd{grid-column:1/-1;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--hd);border-bottom:1px solid var(--ln);box-shadow:0 1px 0 rgba(0,0,0,.03)}#hd .sp{flex:1}#hd b{font-size:14px}
#tabs{display:flex;gap:2px}#tabs button{background:none;border:0;border-radius:8px 8px 0 0;padding:8px 14px;color:var(--mu);font-weight:500}#tabs button.on{background:var(--pn);color:var(--ac);font-weight:700;box-shadow:inset 0 -2px 0 var(--ac)}
#rb{grid-column:1/-1;background:var(--pn);border-bottom:1px solid var(--ln);min-height:64px}.pn{display:none;flex-wrap:wrap;gap:6px;align-items:flex-start;padding:8px 10px;max-height:150px;overflow:auto}.pn.on{display:flex}
.g{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:6px 12px 6px 0;margin-right:6px;border-right:1px solid var(--ln)}.g small{width:100%;opacity:.5;font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
button,select,input,textarea{background:var(--bt);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:6px 10px;font:inherit;transition:background .15s,box-shadow .15s,transform .1s}button{cursor:pointer}button:hover{background:var(--bth)}button:active{transform:translateY(1px)}
button.pri,.chip.on{color:#fff}button.pri{background:var(--ac);border-color:var(--ac);font-weight:600;border-radius:999px;padding:7px 16px;box-shadow:0 2px 10px color-mix(in srgb,var(--ac) 45%,transparent)}button.pri:hover{box-shadow:0 4px 16px color-mix(in srgb,var(--ac) 55%,transparent);filter:brightness(1.05)}input[type=color]{width:30px;height:28px;padding:0}input[type=number]{width:62px}textarea{width:200px;height:56px}
.chip{font-size:12px;padding:5px 10px;border-radius:999px}.chip.on{background:var(--ac);border-color:var(--ac)}.gal{display:flex;flex-wrap:wrap;gap:4px;max-width:900px}.gal h5{width:100%;margin:4px 0 0;font-size:11px;opacity:.6}
#list{overflow:auto;padding:10px;background:var(--bg);border-right:1px solid var(--ln)}
.th{position:relative;margin-bottom:10px;cursor:pointer;border:2px solid transparent;border-radius:10px;overflow:hidden;background:var(--pn);box-shadow:0 1px 3px rgba(0,0,0,.08);transition:box-shadow .15s,transform .1s}.th:hover{box-shadow:0 4px 14px rgba(0,0,0,.14);transform:translateY(-1px)}.th.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 25%,transparent)}.th b{position:absolute;left:5px;top:4px;font-size:10px;font-weight:700;color:#fff;background:rgba(0,0,0,.45);padding:1px 6px;border-radius:999px;backdrop-filter:blur(2px)}
.cq{container-type:inline-size;position:relative;aspect-ratio:16/9;overflow:hidden}
#main{display:flex;padding:18px;overflow:auto;min-height:0;position:relative;background:var(--bg)}
#stw{position:relative;container-type:inline-size;aspect-ratio:16/9;flex:none;margin:auto;width:60%;box-shadow:0 12px 48px rgba(0,0,0,.16);border-radius:6px;background:#000;overflow:hidden}
.sl{position:absolute;inset:0;overflow:hidden}.e{position:absolute;white-space:pre-wrap;line-height:1.2;user-select:none}.e[contenteditable=true]{user-select:text;outline:2px solid #fff8;cursor:text}
.e.sel{outline:2px solid var(--ac);cursor:move}.h{position:absolute;width:11px;height:11px;background:var(--ac);border:2px solid #fff;border-radius:3px}
.h[data-p=nw]{left:-7px;top:-7px;cursor:nwse-resize}.h[data-p=n]{left:calc(50% - 6px);top:-7px;cursor:ns-resize}.h[data-p=ne]{right:-7px;top:-7px;cursor:nesw-resize}.h[data-p=e]{right:-7px;top:calc(50% - 6px);cursor:ew-resize}
.h[data-p=se]{right:-7px;bottom:-7px;cursor:nwse-resize}.h[data-p=s]{left:calc(50% - 6px);bottom:-7px;cursor:ns-resize}.h[data-p=sw]{left:-7px;bottom:-7px;cursor:nesw-resize}.h[data-p=w]{left:-7px;top:calc(50% - 6px);cursor:ew-resize}
.bpw{position:absolute;z-index:50;pointer-events:none;display:none;filter:drop-shadow(0 8px 16px #0006)}.bp{position:absolute;top:0;height:100%}.bp img{width:100%;height:100%;display:block}
.bl{left:0;width:38.47%;transform-origin:100% 27%}.bb{left:38.47%;width:23%}.br{right:0;width:38.53%;transform-origin:0 27%}
@keyframes fl{50%{transform:rotate(-16deg)}}@keyframes fr{50%{transform:rotate(16deg)}}.bpw.fly:not(.rigid) .bl{animation:fl .26s infinite}.bpw.fly:not(.rigid) .br{animation:fr .26s infinite}
#insp{overflow:auto;padding:12px 14px;background:var(--pn);border-left:1px solid var(--ln)}#insp h4{margin:0 0 8px;font-size:13px;font-weight:700}#insp h5{margin:0;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--mu);font-weight:700}
.ig{padding:12px 0;border-top:1px solid var(--ln);display:flex;flex-direction:column;gap:7px}.r2{display:grid;grid-template-columns:1fr 1fr;gap:6px}.r2 label{display:flex;flex-direction:column;font-size:10px;color:var(--mu);gap:2px}.r2 input,.r2 select,#insp select,#insp textarea{width:100%}.r2 button{padding:5px 2px}
#sbar{display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--hd);border-top:1px solid var(--ln);font-size:12px;color:var(--mu);font-weight:500}#sbar input[type=range]{width:110px;padding:0}.lg{color:var(--ac);font-size:16px}#hd b{letter-spacing:.02em}
@media(max-width:1000px){#insp{display:none}#app{grid-template-columns:168px 1fr}}
#qs{position:fixed;inset:0;z-index:5000;background:var(--bg);display:none;flex-direction:column}#qs.on{display:flex}
#qsTop{display:flex;align-items:center;gap:10px;padding:10px 16px;background:var(--hd);border-bottom:1px solid var(--ln);box-shadow:0 1px 0 rgba(0,0,0,.03)}
.qsroom{font-size:12px;color:var(--mu);background:var(--bt);padding:5px 10px;border-radius:999px}.qsroom b{color:var(--tx)}
#qsBody{flex:1;display:grid;grid-template-columns:280px 1fr 320px;min-height:0}
#qsList{overflow:auto;padding:14px;background:var(--pn);border-right:1px solid var(--ln);display:flex;flex-direction:column;gap:10px}
.qsCard{background:var(--bg);border:1.5px solid var(--ln);border-radius:12px;padding:10px 12px;cursor:pointer;transition:box-shadow .15s,border-color .15s}
.qsCard:hover{box-shadow:0 3px 12px rgba(0,0,0,.08)}.qsCard.on{border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 22%,transparent)}
.qsCard .qn{font-size:11px;font-weight:700;color:var(--mu);display:flex;justify-content:space-between}.qsCard .qt{font-size:13px;font-weight:600;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qsCard .qm{font-size:11px;color:var(--mu);margin-top:4px;display:flex;gap:6px;align-items:center}.badge{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:999px}
.badge.quiz{background:#fde68a;color:#78350f}.badge.poll{background:#bfdbfe;color:#1e3a8a}.badge.win{background:#c7f9cc;color:#14532d}
.qsAdd{width:100%;padding:12px;border:1.5px dashed var(--ln);border-radius:12px;background:transparent;font-weight:600;color:var(--ac);cursor:pointer}.qsAdd.alt{color:#b45309}
#qsEdit{overflow:auto;padding:26px 32px;max-width:760px}
#qsEdit .qBig{width:100%;font-size:22px;font-weight:700;padding:14px 16px;border-radius:12px;margin-bottom:18px}
.qOptRow{display:flex;align-items:center;gap:10px;margin-bottom:10px;background:var(--pn);border:1.5px solid var(--ln);border-radius:12px;padding:8px 10px;transition:border-color .15s,background .15s}
.qOptRow input[type=text]{flex:1;border:0;background:transparent;font-size:15px;padding:6px}
.qOptRow .letter{width:26px;height:26px;border-radius:50%;background:var(--bt);color:var(--mu);font-size:12px;font-weight:700;display:grid;place-items:center;flex:none}
.qOptRow .okbtn{flex:none;cursor:pointer;border:1.5px solid var(--ln);background:var(--bg);color:var(--mu);font-size:12px;font-weight:700;padding:6px 12px;border-radius:999px;white-space:nowrap}
.qOptRow .okbtn:hover{border-color:#16a34a;color:#16a34a}
.qOptRow.iscorrect{border-color:#16a34a;background:color-mix(in srgb,#16a34a 10%,var(--pn))}.qOptRow.iscorrect .okbtn{background:#16a34a;border-color:#16a34a;color:#fff}
.qOptRow.iscorrect .letter{background:#16a34a;color:#fff}
.qOptRow .rm{color:var(--mu);cursor:pointer;flex:none;padding:4px 6px;border-radius:6px}.qOptRow .rm:hover{background:var(--bt);color:#dc2626}
.qRow2{display:flex;gap:22px;margin:20px 0;flex-wrap:wrap}.qRow2 label{font-size:12px;color:var(--mu);font-weight:600;display:flex;flex-direction:column;gap:5px}
.seg{display:flex;border:1.5px solid var(--ln);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:var(--bg);padding:8px 14px}.seg button.on{background:var(--ac);color:#fff}
#qsPrev{background:var(--pn);border-left:1px solid var(--ln);padding:14px;overflow:auto}.qsPrevHead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mu);font-weight:700;margin-bottom:10px}
#qsPrevBox{aspect-ratio:16/9;border-radius:10px;overflow:hidden;box-shadow:0 6px 24px rgba(0,0,0,.18);position:relative}
.emptyQ{color:var(--mu);text-align:center;padding:60px 20px}
#cm{position:fixed;display:none;z-index:9999;background:var(--pn);color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:4px;min-width:200px;box-shadow:0 10px 30px #000a}#cm div{padding:6px 10px;border-radius:5px;cursor:pointer;display:flex;justify-content:space-between;gap:20px}#cm div:hover{background:var(--ac);color:#fff}#cm div.d{opacity:.4;pointer-events:none}#cm i{opacity:.55;font-style:normal}#cm hr{border:0;border-top:1px solid var(--ln);margin:3px 0}
#pc{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:none;gap:8px;z-index:9000;background:#000a;padding:8px 12px;border-radius:10px}

.podWrap{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;color:#fff;font-family:inherit}
.podTrophy{font-size:8cqw;margin-bottom:1cqw;opacity:0;transform:translateY(20px) scale(.6)}.podTrophy.go{animation:podPop .7s cubic-bezier(.34,1.6,.64,1) forwards}
.podTitle{font-size:4.4cqw;font-weight:800;margin-bottom:2cqw;opacity:0;transform:translateY(-10px)}.podTitle.go{animation:podFade .5s ease forwards .15s}
.podRow{display:flex;align-items:flex-end;gap:2.2cqw;margin-bottom:0}
.podCol{display:flex;flex-direction:column;align-items:center;width:15cqw}
.podName{font-size:1.9cqw;font-weight:700;margin-bottom:.4cqw;opacity:0;transform:translateY(10px);text-align:center;max-width:15cqw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.podScore{font-size:1.4cqw;opacity:0;margin-bottom:.6cqw;font-weight:600}
.podBlock{width:100%;border-radius:.6cqw .6cqw 0 0;display:flex;align-items:flex-start;justify-content:center;padding-top:.8cqw;font-size:2.6cqw;font-weight:800;transform:scaleY(0);transform-origin:bottom;box-shadow:0 -4px 18px rgba(0,0,0,.25) inset}
.podCol.go .podBlock{animation:podRise .55s cubic-bezier(.2,.8,.2,1) forwards}
.podCol.go .podName{animation:podFade .4s ease forwards}
.podCol.go .podScore{animation:podFade .4s ease forwards}
.p1 .podBlock{background:linear-gradient(180deg,#ffe27a,#d4a017);height:15cqw}.p2 .podBlock{background:linear-gradient(180deg,#e6e9ef,#9aa3b2);height:10.5cqw}.p3 .podBlock{background:linear-gradient(180deg,#f0b98a,#b5651d);height:7.5cqw}
.podRest{margin-top:1.6cqw;display:flex;flex-direction:column;gap:.4cqw;width:44%;opacity:0}.podRest.go{animation:podFade .5s ease forwards .9s}
.podRestRow{display:flex;justify-content:space-between;background:rgba(255,255,255,.12);padding:.5cqw 1.2cqw;border-radius:.6cqw;font-size:1.5cqw}
@keyframes podPop{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes podFade{to{opacity:1;transform:none}}
@keyframes podRise{to{transform:scaleY(1)}}
.confetti{position:absolute;top:-5%;width:.9cqw;height:1.8cqw;opacity:.95;animation:confFall linear forwards}
@keyframes confFall{to{transform:translateY(112vh) rotate(720deg);opacity:.3}}
body.pr #app{display:block}body.pr #hd,body.pr #rb,body.pr #list,body.pr #insp,body.pr #sbar{display:none}body.pr #main{padding:0;height:100%;background:#000}body.pr #stw{width:min(100vw,100vh*16/9);box-shadow:none}body.pr .e{pointer-events:none}body.pr #pc.on{display:flex}
</style></head><body>

// a plain domain, http instead of ws, a trailing /j/CODE from a previous
// session…). Whatever they paste, we only need the host — so pull that out
// and always reconnect it to the one real endpoint: <scheme>://<host>/ws.
function normalizeWsUrl(raw){raw=(raw||'').trim();if(!raw)return '';
 const wantsSecure=!/^(ws|http):\/\//i.test(raw);                 // default to wss unless they clearly typed ws:// or http://
 let probe=raw.replace(/^wss?:\/\//i,'https://').replace(/^ws:\/\//i,'http://');
 if(!/^https?:\/\//i.test(probe))probe='https://'+probe;
 let host;try{host=new URL(probe).host}catch(e){host=raw.replace(/^\w+:\/\//,'').split('/')[0]}
 if(!host)return '';
 return (wantsSecure?'wss://':'ws://')+host+'/ws'}
function connect(uRaw){const u=normalizeWsUrl(uRaw);if(!u)return liveStatus('Enter your server address (e.g. pectaa.bonto.run)',1);

 liveStatus('Connecting…');let opened=false;
 try{
  const w=LV.ws=new WebSocket(u);
  const timeout=setTimeout(()=>{if(!opened){liveStatus('No response from server — check the URL and that it is running',1);try{w.close()}catch(e){}}},7000);
  w.onopen=()=>{opened=true;clearTimeout(timeout);let ri={};try{ri=JSON.parse(localStorage.getItem('ss_room')||'{}')}catch(x){}

   liveStatus('Connected — waiting for room…')};
  w.onclose=ev=>{clearTimeout(timeout);LV.ws=null;
   if(!opened)liveStatus('Could not reach '+u+' (code '+ev.code+'). Check the server is running and the URL is exactly right.',1);
   else liveStatus('Disconnected from Live Server',1)};
  w.onerror=()=>{};
  w.onmessage=m=>{try{const d=JSON.parse(m.data);
   if(d.t=='vote')vote({e:openPoll(),i:d.choice,n:d.name||d.pid,k:d.pid});
   else if(d.t=='room'){clearTimeout(timeout);LV.join=d.url;LV.room=d.code;liveStatus('Room <b>'+d.code+'</b>');try{localStorage.setItem('ss_room',JSON.stringify({code:d.code,key:d.key}))}catch(x){}refreshJoinCards()}

/* ---------- CUSTOM FLYING LOGO (auto wing-split) ---------- */
function tightBBox(ctx,w,h){const d=ctx.getImageData(0,0,w,h).data;let x0=w,y0=h,x1=0,y1=0,any=false;
 for(let y=0;y<h;y+=2)for(let x=0;x<w;x+=2)if(d[(y*w+x)*4+3]>20){any=true;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 return any?{x:x0,y:y0,w:x1-x0+2,h:y1-y0+2}:{x:0,y:0,w,h}}
function findWaist(ctx,b){const d=ctx.getImageData(b.x,b.y,b.w,b.h).data,col=new Array(b.w).fill(0);
 for(let x=0;x<b.w;x++){let c=0;for(let y=0;y<b.h;y+=2)if(d[(y*b.w+x)*4+3]>20)c++;col[x]=c}
 const lo=Math.round(b.w*.28),hi=Math.round(b.w*.72);let best=lo,bv=Infinity;for(let x=lo;x<=hi;x++)if(col[x]<bv){bv=col[x];best=x}
 const avg=col.reduce((a,c)=>a+c,0)/b.w;return{waist:best/b.w,flappable:avg>0&&bv<avg*.65}}
function sliceData(img,b,x0,x1){const w=Math.max(1,Math.round((x1-x0)*b.w)),h=b.h,c=document.createElement('canvas');c.width=w;c.height=h;
 c.getContext('2d').drawImage(img,b.x+x0*b.w,b.y,w,h,0,0,w,h);return c.toDataURL('image/png')}
async function processFlyer(file){const url=await up(file),img=new Image();img.crossOrigin='anonymous';await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});
 const c=document.createElement('canvas');c.width=img.naturalWidth;c.height=img.naturalHeight;const ctx=c.getContext('2d');ctx.drawImage(img,0,0);
 const bb=tightBBox(ctx,c.width,c.height),info=findWaist(ctx,bb),half=.11,w0=Math.max(.15,info.waist-half),w1=Math.min(.85,info.waist+half);
 return{left:sliceData(img,bb,0,w0),body:sliceData(img,bb,w0,w1),right:sliceData(img,bb,w1,1),aspect:bb.w/bb.h,flap:info.flappable,name:file.name};}
on('ffly','change',async ev=>{const f=ev.target.files[0];ev.target.value='';if(!f)return;st('Analysing image…');
 try{S.flyer=await processFlyer(f);birdPos();sv();$('flyname').textContent='Using: '+S.flyer.name+(S.flyer.flap?' (wings detected)':' (rigid — no flap)');st('')}catch(x){st('Could not process image')}});

function allQuestions(){const out=[];S.sl.forEach((s,si)=>s.els.forEach((e,ei)=>{if(e.t=='poll'||e.t=='board')out.push({si,ei,e})}));return out}
let qsSel=null;
function qsOpen(){$('qs').classList.add('on');qsSel=qsSel||(allQuestions()[0]||{}).e&&allQuestions()[0].e.id;qsRender();qsSession()}
function qsClose(){$('qs').classList.remove('on');draw()}
function qsAddQuestion(kind){const s=ns();s.bg='';s.bgc=TH[S.th].bg;const e={id:U(),t:'poll',k:kind,x:8,y:12,w:84,h:76,q:'',o:[{t:'',v:0},{t:'',v:0}],ok:0,tm:20,fs:3,an:'none'};s.els=[e];
 const at=Math.max(0,S.sl.findIndex(x=>x.id===cur().id)+1);S.sl.splice(at,0,s);S.cur=at;qsSel=e.id;draw();sv();qsRender()}
function qsAddWinner(){const s=ns();s.bg='';s.bgc=TH[S.th].bg;const e={id:U(),t:'board',x:8,y:8,w:84,h:84};s.els=[e];
 S.sl.push(s);S.cur=S.sl.length-1;qsSel=e.id;draw();sv();qsRender()}
function qsFind(id){for(const it of allQuestions())if(it.e.id===id)return it;return null}
function qsDelete(id){const it=qsFind(id);if(!it)return;const si=S.sl.findIndex(s=>s.els.some(e=>e.id===id));if(si<0)return;S.sl.splice(si,1);if(!S.sl.length)S.sl=[ns()];S.cur=Math.min(S.cur,S.sl.length-1);
 if(qsSel===id)qsSel=(allQuestions()[0]||{}).e&&allQuestions()[0].e.id;draw();sv();qsRender()}
function qsMove(id,dir){const si=S.sl.findIndex(s=>s.els.some(e=>e.id===id));const nj=si+dir;if(si<0||nj<0||nj>=S.sl.length)return;[S.sl[si],S.sl[nj]]=[S.sl[nj],S.sl[si]];draw();sv();qsRender()}
function qsItems(){const L=$('qsItems');const qs=allQuestions();L.innerHTML=qs.length?'':'<div class="emptyQ" style="padding:20px 4px">No questions yet.<br>Add one below to get started.</div>';
 qs.forEach((it,idx)=>{const e=it.e,c=document.createElement('div');c.className='qsCard'+(e.id===qsSel?' on':'');
  const kind=e.t=='board'?'win':(e.k||'poll'),label=e.t=='board'?'🏆 Winner screen':(e.q||'Untitled question');
  c.innerHTML='<div class="qn"><span>#'+(idx+1)+'</span><span class="badge '+kind+'">'+(kind=='win'?'WINNER':kind.toUpperCase())+'</span></div><div class="qt">'+esc(label)+'</div>'+(e.t=='poll'?'<div class="qm">'+e.o.length+' options · '+e.tm+'s</div>':'<div class="qm">Podium + confetti</div>');
  c.onclick=()=>{qsSel=e.id;S.cur=S.sl.findIndex(s=>s.els.some(x=>x.id===e.id));qsRender()};L.appendChild(c)});}
function qsEditor(){const M=$('qsEdit'),it=qsFind(qsSel);
 if(!it){M.innerHTML='<div class="emptyQ">Select a question on the left, or add a new one.</div>';return}
 const e=it.e;
 if(e.t=='board'){M.innerHTML='<h2 style="margin-top:0">🏆 Winner screen</h2><p style="color:var(--mu);max-width:500px">Automatically shows a podium for the top 3 and a list below, with a confetti reveal — built from scores collected across every quiz question so far. Nothing to configure here; just make sure it comes after your quiz questions in the deck.</p>'+B('qs_prevwin','▶ Preview the reveal');return}
 M.innerHTML='<div class="qRow2" style="margin-top:0;margin-bottom:18px"><label>Question type<span class="seg"><button data-k="poll" class="'+(e.k!='quiz'?'on':'')+'">📊 Poll (no right answer)</button><button data-k="quiz" class="'+(e.k=='quiz'?'on':'')+'">🏆 Quiz (has a correct answer + scoring)</button></span></label></div>'+
  '<input id="qeQ" class="qBig" placeholder="Type your question…" value="'+esc(e.q)+'"><div id="qeOptsHint" style="font-size:12px;color:var(--mu);margin:2px 0 10px">'+(e.k=='quiz'?'Click <b>Correct</b> next to the right answer.':'Poll mode — no answer is scored as correct.')+'</div><div id="qeOpts"></div><button class="qsAdd" id="qeAddOpt" style="margin-top:4px">&#43; Add option</button>'+
  '<div class="qRow2"><label>Timer (seconds)<input type="number" id="qeTm" min="5" max="300" value="'+e.tm+'" style="width:80px"></label>'+
  '<label>Question size<input type="number" id="qeFs" min="1" max="6" step=".1" value="'+(e.fs||3)+'" style="width:80px"></label></div>'+
  '<div style="display:flex;gap:8px;margin-top:10px">'+B('qs_del','Delete question')+B('qs_up','Move up')+B('qs_dn','Move down')+B('qs_prevq','▶ Preview live')+'</div>';
 qsOpts();
 on2('qeQ','input',ev=>{e.q=ev.target.value;qsItems();qsPreview();sv()});
 on2('qeTm','change',ev=>{e.tm=Math.max(5,+ev.target.value||20);qsItems();sv()});
 on2('qeFs','change',ev=>{e.fs=+ev.target.value||3;qsPreview();sv()});
 $('qeAddOpt').onclick=()=>{e.o.push({t:'',v:0});qsOpts();sv()};
 document.querySelectorAll('#qsEdit [data-k]').forEach(b=>b.onclick=()=>{e.k=b.dataset.k;qsEditor();sv()});
}
function qsOpts(){const it=qsFind(qsSel);if(!it||it.e.t!='poll')return;const e=it.e,W=$('qeOpts'),isQuiz=e.k=='quiz';W.innerHTML='';
 e.o.forEach((o,i)=>{const r=document.createElement('div');r.className='qOptRow'+(isQuiz&&e.ok===i?' iscorrect':'');
  r.innerHTML='<span class="letter">'+String.fromCharCode(65+i)+'</span><input type="text" placeholder="Option '+(i+1)+'" value="'+esc(o.t)+'">'+(isQuiz?'<button type="button" class="okbtn">'+(e.ok===i?'&#10003; Correct':'Mark correct')+'</button>':'')+'<span class="rm" title="Remove option">&#10005;</span>';
  r.querySelector('input').oninput=ev=>{o.t=ev.target.value;qsPreview();sv()};
  if(isQuiz)r.querySelector('.okbtn').onclick=()=>{e.ok=i;qsOpts();sv()};
  r.querySelector('.rm').onclick=()=>{if(e.o.length>2){e.o.splice(i,1);if(e.ok>=e.o.length)e.ok=0;qsOpts();sv()}};
  W.appendChild(r)});qsPreview()}
function qsPreview(){const B2=$('qsPrevBox'),it=qsFind(qsSel);B2.innerHTML='';if(!it)return;
 const wrap=document.createElement('div');wrap.style.cssText='position:absolute;inset:0;container-type:inline-size';wrap.style.background=TH[S.th].bg;

document.addEventListener('click',ev=>{const b=ev.target.closest('[data-a="qs_del"]');if(b)qsDelete(qsSel);

function topScores(){if(LV.ws)return Object.entries(LV.scores).sort((a,b)=>b[1]-a[1]);
 const demo=[['Ayesha',420],['Bilal',380],['Zara',350],['Hamza',300],['Noor',260],['Omar',210]];return LV.scores&&Object.keys(LV.scores).length?Object.entries(LV.scores).sort((a,b)=>b[1]-a[1]):demo}
function buildPodium(rows,animate){const T=TH[S.th],wrap=document.createElement('div');wrap.className='podWrap';wrap.style.fontFamily="'"+T.f+"',sans-serif";
 const top3=rows.slice(0,3),order=[top3[1],top3[0],top3[2]],cls=['p2','p1','p3'],medal=['🥈','🥇','🥉'];
 wrap.innerHTML='<div class="podTrophy">🏆</div><div class="podTitle">Leaderboard</div><div class="podRow"></div><div class="podRest"></div>';
 const row=wrap.querySelector('.podRow');order.forEach((r,i)=>{const col=document.createElement('div');col.className='podCol '+cls[i];
  col.innerHTML='<div class="podName">'+(r?esc(r[0]):'—')+'</div><div class="podScore">'+(r?r[1]+' pts':'')+'</div><div class="podBlock">'+medal[i]+'</div>';row.appendChild(col)});
 const rest=wrap.querySelector('.podRest');rows.slice(3,8).forEach((r,i)=>{const d=document.createElement('div');d.className='podRestRow';d.innerHTML='<span>'+(i+4)+'. '+esc(r[0])+'</span><b>'+r[1]+' pts</b>';rest.appendChild(d)});
 if(animate)requestAnimationFrame(()=>playPodium(wrap));return wrap}
function confettiBurst(wrap,n){const cols=['#ff5c8a','#ffd166','#06d6a0','#4cc9f0','#c77dff','#f4a261'];
 for(let i=0;i<(n||70);i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];
  c.style.animationDuration=(2.2+Math.random()*1.6)+'s';c.style.animationDelay=(Math.random()*.6)+'s';c.style.borderRadius=Math.random()<.5?'50%':'2px';wrap.appendChild(c);
  setTimeout(()=>c.remove(),4200)}}
function playPodium(wrap){wrap.querySelector('.podTrophy').classList.add('go');wrap.querySelector('.podTitle').classList.add('go');
 const cols=[...wrap.querySelectorAll('.podCol')],ord=[1,0,2].map(i=>cols[i]).filter(Boolean);
 ord.forEach((c,i)=>setTimeout(()=>{c.classList.add('go');if(i===0)confettiBurst(wrap,90)},250+i*260));
 setTimeout(()=>wrap.querySelector('.podRest').classList.add('go'),1050)}
